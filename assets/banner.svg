<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3B3C"/>
      <stop offset="0.55" stop-color="#0E4F52"/>
      <stop offset="1" stop-color="#14324F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#glow)"/>

  <!-- faint grid dots -->
  <g fill="#FFFFFF" opacity="0.06">
    <circle cx="40" cy="40" r="2"/><circle cx="80" cy="40" r="2"/><circle cx="120" cy="40" r="2"/>
    <circle cx="40" cy="80" r="2"/><circle cx="80" cy="80" r="2"/><circle cx="40" cy="120" r="2"/>
    <circle cx="1240" cy="400" r="2"/><circle cx="1200" cy="400" r="2"/><circle cx="1240" cy="360" r="2"/>
  </g>

  <!-- Left: wordmark -->
  <g transform="translate(80,0)">
    <rect x="0" y="92" width="196" height="30" rx="15" fill="#2DD4BF" fill-opacity="0.16" stroke="#2DD4BF" stroke-opacity="0.5"/>
    <text x="98" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#99F6E4" letter-spacing="1.5">BUILD FOR BHARAT</text>

    <text x="0" y="200" font-size="78" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">OPD <tspan fill="#5EEAD4">Saathi</tspan></text>
    <text x="2" y="246" font-size="28" font-weight="600" fill="#E2E8F0">अगला कदम, सही समय पर।</text>
    <text x="2" y="284" font-size="22" fill="#94A3B8">Next step. Right time. On any phone.</text>

    <!-- journey path -->
    <g transform="translate(4,330)">
      <line x1="10" y1="12" x2="470" y2="12" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
      <g font-size="14" fill="#CBD5E1" text-anchor="middle">
        <circle cx="10" cy="12" r="10" fill="#38BDF8"/>
        <text x="10" y="50">Registration</text>
        <circle cx="160" cy="12" r="10" fill="#34D399"/>
        <text x="160" y="50">Doctor</text>
        <circle cx="315" cy="12" r="10" fill="#FBBF24"/>
        <text x="315" y="50">Lab</text>
        <circle cx="470" cy="12" r="10" fill="#F472B6"/>
        <text x="470" y="50">Pharmacy</text>
      </g>
    </g>
  </g>

  <!-- Right: keypad phone -->
  <g transform="translate(930,46)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="350" rx="34" fill="url(#phone)" stroke="#374151" stroke-width="2"/>
    <rect x="70" y="16" width="60" height="6" rx="3" fill="#4B5563"/>
    <!-- screen -->
    <rect x="20" y="36" width="160" height="132" rx="10" fill="#ECFDF5"/>
    <text x="32" y="58" font-size="11" font-weight="700" fill="#065F46">SMS · OPD-SAATHI</text>
    <line x1="32" y1="66" x2="168" y2="66" stroke="#A7F3D0"/>
    <text x="32" y="86" font-size="14" font-weight="700" fill="#064E3B">Token 45</text>
    <text x="32" y="106" font-size="12" fill="#065F46">Bldg B · Floor 2</text>
    <text x="32" y="123" font-size="12" fill="#065F46">Room 14 · GREEN line</text>
    <rect x="32" y="134" width="96" height="22" rx="11" fill="#10B981"/>
    <text x="80" y="149" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3 ahead of you</text>
    <!-- keypad -->
    <g fill="#374151">
      <rect x="28" y="188" width="44" height="26" rx="8"/><rect x="78" y="188" width="44" height="26" rx="8"/><rect x="128" y="188" width="44" height="26" rx="8"/>
      <rect x="28" y="222" width="44" height="26" rx="8"/><rect x="78" y="222" width="44" height="26" rx="8"/><rect x="128" y="222" width="44" height="26" rx="8"/>
      <rect x="28" y="256" width="44" height="26" rx="8"/><rect x="78" y="256" width="44" height="26" rx="8"/><rect x="128" y="256" width="44" height="26" rx="8"/>
      <rect x="28" y="290" width="44" height="26" rx="8"/><rect x="78" y="290" width="44" height="26" rx="8"/><rect x="128" y="290" width="44" height="26" rx="8"/>
    </g>
    <g font-size="13" font-weight="600" fill="#D1D5DB" text-anchor="middle">
      <text x="50" y="206">1</text><text x="100" y="206">2</text><text x="150" y="206">3</text>
      <text x="50" y="240">4</text><text x="100" y="240">5</text><text x="150" y="240">6</text>
      <text x="50" y="274">7</text><text x="100" y="274">8</text><text x="150" y="274">9</text>
      <text x="50" y="308">*</text><text x="100" y="308">0</text><text x="150" y="308">#</text>
    </g>
  </g>

  <!-- voice call bubble -->
  <g transform="translate(664,92)">
    <rect x="0" y="0" width="250" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <path d="M250 30 L268 40 L248 46 Z" fill="#FFFFFF" fill-opacity="0.96"/>
    <circle cx="34" cy="37" r="18" fill="#0EA5E9"/>
    <path d="M27 29 q2 -3 5 -1 l3 4 q1 2 -1 4 l-2 1 q2 5 7 7 l1 -2 q2 -2 4 -1 l4 3 q2 3 -1 5 q-4 3 -9 0 q-9 -5 -13 -14 q-2 -4 2 -6z" fill="#FFFFFF"/>
    <text x="62" y="31" font-size="12" font-weight="700" fill="#0C4A6E">Voice call · Hindi</text>
    <text x="62" y="52" font-size="13" fill="#0F172A">"Aapka number aane wala hai"</text>
  </g>

  <g transform="translate(726,250)">
    <rect x="0" y="0" width="170" height="54" rx="16" fill="#0F172A" fill-opacity="0.55" stroke="#5EEAD4" stroke-opacity="0.5"/>
    <text x="85" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#5EEAD4">NO APP · NO INTERNET</text>
    <text x="85" y="42" text-anchor="middle" font-size="12" fill="#CBD5E1">SMS + voice on any phone</text>
  </g>
</svg>
